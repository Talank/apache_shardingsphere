name: Required - Check

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  push:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  global-environment:
    name: Import Global Environment
    uses: ./.github/workflows/required-reusable.yml

  check-checkstyle:
    if: always()
    name: Check - CheckStyle
    needs: global-environment
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Run CheckStyle
        run: ./mvnw checkstyle:check -Pcheck -T1C

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
  check-spotless:
    if: always()
    name: Check - Spotless
    needs: global-environment
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Run Spotless
        run: ./mvnw spotless:check -Pcheck -T1C

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
  check-license:
    if: always()
    name: Check - License
    needs: global-environment
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.1
      - name: Run Apache Rat
        run: ./mvnw apache-rat:check -Pcheck -T1C
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
      fail-fast: false
